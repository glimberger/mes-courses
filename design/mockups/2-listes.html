<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="statusbar">
    <span>9:41</span>
    <span class="right">
      <span class="material-symbols-rounded">signal_cellular_alt</span>
      <span class="material-symbols-rounded">wifi</span>
      <span class="material-symbols-rounded">battery_full</span>
    </span>
  </div>

  <div class="appbar center"><h1>Mes listes</h1></div>

  <div class="cards" style="padding-top:14px">
    <div class="card"><div class="rowline" style="padding:14px 16px">
      <span class="lead"><span class="material-symbols-rounded">format_list_bulleted</span></span>
      <div class="texts">
        <div class="t1">Barbecue</div>
        <div class="t2">0 article</div>
      </div>
      <span class="material-symbols-rounded" style="color:var(--on-surface-var)">chevron_right</span>
    </div></div>

    <div class="card" style="outline:2px solid var(--yellow); outline-offset:-2px"><div class="rowline" style="padding:14px 16px">
      <span class="lead"><span class="material-symbols-rounded">format_list_bulleted</span></span>
      <div class="texts">
        <div class="t1">Ma liste</div>
        <div class="t2">4 articles</div>
      </div>
      <span class="chip brand"><span class="material-symbols-rounded">check</span>Liste actuelle</span>
    </div></div>

    <div class="card"><div class="rowline" style="padding:14px 16px">
      <span class="lead"><span class="material-symbols-rounded">format_list_bulleted</span></span>
      <div class="texts">
        <div class="t1">Noël en famille</div>
        <div class="t2">12 articles</div>
      </div>
      <span class="material-symbols-rounded" style="color:var(--on-surface-var)">chevron_right</span>
    </div></div>
  </div>

  <div class="fab"><span class="material-symbols-rounded">add</span>Nouvelle liste</div>
</body>
</html>
