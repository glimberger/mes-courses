<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="statusbar">
    <span>9:41</span>
    <span class="right">
      <span class="material-symbols-rounded">signal_cellular_alt</span>
      <span class="material-symbols-rounded">wifi</span>
      <span class="material-symbols-rounded">battery_full</span>
    </span>
  </div>

  <div class="appbar">
    <button class="iconbtn back"><span class="material-symbols-rounded">arrow_back</span></button>
    <div class="titles"><h1 style="font-size:22px">Ajouter des articles</h1></div>
  </div>
  <div class="searchbar"><span class="material-symbols-rounded">search</span>Rechercher un article</div>
  <div class="section"><span class="bar"></span><h2>Fruits et légumes</h2></div>
  <div class="cards">
    <div class="card added"><div class="row" role="button" aria-label="Carotte ajouté, toucher pour retirer">
      <div class="texts"><span class="name">Carotte</span></div>
      <span class="toggle"><span class="material-symbols-rounded">check_circle</span></span>
    </div></div>
    <div class="card"><div class="row" role="button" aria-label="Ajouter Courgette">
      <div class="texts"><span class="name">Courgette</span></div>
      <span class="toggle"><span class="material-symbols-rounded">add_circle</span></span>
    </div></div>
  </div>
  <div class="section"><span class="bar"></span><h2>Crèmerie</h2></div>
  <div class="cards">
    <div class="card added"><div class="row" role="button" aria-label="Beurre ajouté, toucher pour retirer">
      <div class="texts"><span class="name">Beurre</span></div>
      <span class="toggle"><span class="material-symbols-rounded">check_circle</span></span>
    </div></div>
    <div class="card"><div class="row" role="button" aria-label="Ajouter Œufs">
      <div class="texts"><span class="name">Œufs</span></div>
      <span class="toggle"><span class="material-symbols-rounded">add_circle</span></span>
    </div></div>
    <div class="card"><div class="row" role="button" aria-label="Ajouter Yaourt à la grecque nature au lait entier de brebis bio x 12">
      <div class="texts"><span class="name">Yaourt à la grecque nature au lait entier de brebis bio x 12</span></div>
      <span class="toggle"><span class="material-symbols-rounded">add_circle</span></span>
    </div></div>
  </div>
</body>
</html>
