<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="statusbar">
    <span>9:41</span>
    <span class="right">
      <span class="material-symbols-rounded">signal_cellular_alt</span>
      <span class="material-symbols-rounded">wifi</span>
      <span class="material-symbols-rounded">battery_full</span>
    </span>
  </div>

  <div class="appbar">
    <button class="iconbtn back"><span class="material-symbols-rounded">arrow_back</span></button>
    <div class="titles"><h1 style="font-size:22px">Ajouter des articles</h1></div>
  </div>
  <div class="searchbar"><span class="material-symbols-rounded">search</span>Lait</div>
  <div class="hint-row">
    <span class="material-symbols-rounded">info</span>
    « Lait » est déjà dans la liste
  </div>
  <nav class="tabbar">
    <div class="tab active"><span class="pill"><span class="material-symbols-rounded">shopping_cart</span></span>Courses</div>
    <div class="tab"><span class="pill"><span class="material-symbols-rounded">format_list_bulleted</span></span>Listes</div>
    <div class="tab"><span class="pill"><span class="material-symbols-rounded">grocery</span></span>Articles</div>
    <div class="tab"><span class="pill"><span class="material-symbols-rounded">settings</span></span>Réglages</div>
  </nav>
</body>
</html>
