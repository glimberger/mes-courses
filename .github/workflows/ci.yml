name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - run: nix develop --command yarn install --immutable
      - run: nix develop --command yarn typecheck

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - run: nix develop --command yarn install --immutable
      - run: nix develop --command yarn lint
      - run: nix develop --command yarn format:check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - run: nix develop --command yarn install --immutable
      - run: nix develop --command yarn test
      - run: nix develop --command yarn test:architecture

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - run: nix develop --command yarn install --immutable
      - run: nix develop --command yarn build

  # Decides whether the device suite is needed: a pull request that changes only documentation
  # (specs/, .specify/, Markdown files) skips it (constitution v2.2.0, research R17).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="$(git merge-base "origin/${{ github.base_ref }}" HEAD)"
            git diff --name-only "$base" HEAD | .github/scripts/app-changed.sh >> "$GITHUB_OUTPUT"
          else
            echo "app=true" >> "$GITHUB_OUTPUT"
          fi

  e2e-android:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The runner's preinstalled Android SDK is used, outside Nix (research R21).
      # `nix develop` keeps JAVA_HOME and ANDROID_HOME from the environment.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('yarn.lock', 'apps/mobile/app.config.ts') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: nix develop --command yarn install --immutable
      - run: nix develop --command yarn workspace @mes-courses/e2e-tests e2e:build:android
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          avd-name: Pixel_API_35
          disable-animations: true
          script: nix develop --command yarn workspace @mes-courses/e2e-tests e2e:test:android
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: detox-artifacts
          path: tests/e2e/artifacts/
          if-no-files-found: ignore
