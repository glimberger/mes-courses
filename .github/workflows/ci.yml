name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a pull request cancels the run of its previous commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  # A release bump pull request (.github/scripts/release-bump.sh: bump title, and a diff that holds
  # only the `version` line of app.config.ts and the changelog files) skips the work of the four
  # required jobs below: they keep their names, so the ruleset is satisfied, and succeed at once.
  # The decision is made from the diff, never from the title alone; any other pull request, and
  # every push to main, runs everything.
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      bump: ${{ steps.bump.outputs.bump }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: bump
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # The script is read from the base commit, so a pull request cannot rewrite the rule
          # that judges it; when the base has no script yet, the answer is "not a bump".
          result=
          if [ "$EVENT_NAME" = pull_request ]; then
            result=$(git show "$BASE_SHA:.github/scripts/release-bump.sh" | sh -s -- "$PR_TITLE" "$BASE_SHA" "$HEAD_SHA") || result=
          fi
          echo "${result:-bump=false}" >> "$GITHUB_OUTPUT"

  typecheck:
    runs-on: ubuntu-latest
    needs: detect
    timeout-minutes: 15
    steps:
      - if: needs.detect.outputs.bump != 'true'
        uses: actions/checkout@v7
      - if: needs.detect.outputs.bump != 'true'
        uses: DeterminateSystems/determinate-nix-action@v3
      - if: needs.detect.outputs.bump != 'true'
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      - if: needs.detect.outputs.bump != 'true'
        run: nix develop --command pnpm install --frozen-lockfile
      - if: needs.detect.outputs.bump != 'true'
        run: nix develop --command pnpm typecheck

  lint:
    runs-on: ubuntu-latest
    needs: detect
    timeout-minutes: 15
    steps:
      - if: needs.detect.outputs.bump != 'true'
        uses: actions/checkout@v7
      - if: needs.detect.outputs.bump != 'true'
        uses: DeterminateSystems/determinate-nix-action@v3
      - if: needs.detect.outputs.bump != 'true'
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      - if: needs.detect.outputs.bump != 'true'
        run: nix develop --command pnpm install --frozen-lockfile
      - if: needs.detect.outputs.bump != 'true'
        run: nix develop --command pnpm lint
      - if: needs.detect.outputs.bump != 'true'
        run: nix develop --command pnpm format:check
      - if: needs.detect.outputs.bump != 'true'
        run: nix develop --command actionlint

  test:
    runs-on: ubuntu-latest
    needs: detect
    timeout-minutes: 15
    steps:
      - if: needs.detect.outputs.bump != 'true'
        uses: actions/checkout@v7
      - if: needs.detect.outputs.bump != 'true'
        uses: DeterminateSystems/determinate-nix-action@v3
      - if: needs.detect.outputs.bump != 'true'
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      - if: needs.detect.outputs.bump != 'true'
        run: nix develop --command pnpm install --frozen-lockfile
      - if: needs.detect.outputs.bump != 'true'
        run: nix develop --command pnpm test
      - if: needs.detect.outputs.bump != 'true'
        run: nix develop --command pnpm test:architecture
      - if: needs.detect.outputs.bump != 'true'
        run: nix develop --command pnpm test:hooks
      - if: needs.detect.outputs.bump != 'true'
        run: nix develop --command pnpm test:scripts

  build:
    runs-on: ubuntu-latest
    needs: detect
    timeout-minutes: 15
    steps:
      - if: needs.detect.outputs.bump != 'true'
        uses: actions/checkout@v7
      - if: needs.detect.outputs.bump != 'true'
        uses: DeterminateSystems/determinate-nix-action@v3
      - if: needs.detect.outputs.bump != 'true'
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      - if: needs.detect.outputs.bump != 'true'
        run: nix develop --command pnpm install --frozen-lockfile
      - if: needs.detect.outputs.bump != 'true'
        run: nix develop --command pnpm build
      - if: needs.detect.outputs.bump != 'true'
        run: nix develop --command sh .github/scripts/server-smoke.sh
