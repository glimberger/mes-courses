name: E2E Android

# The Android device suite takes about thirty minutes, so it does not run on every push to a
# pull request (constitution v2.3.0). It runs on every push to main, and on demand on a branch:
#   gh workflow run e2e.yml --ref <branch>
# A pull request that is not documentation-only (.github/scripts/app-changed.sh) is merged only
# with a green run on its latest commit.
on:
  workflow_dispatch:
  push:
    branches: [main]

# A new run on the same branch cancels the previous one.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  e2e-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # The native build of every React Native module, Gradle's caches and the Nix store need more
      # than the free disk of a hosted runner: remove tools this job never uses.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium
          df -h /
      - uses: actions/checkout@v7
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The runner's preinstalled Android SDK is used, outside Nix (research R21).
      # `nix develop` keeps JAVA_HOME and ANDROID_HOME from the environment.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      # Restored from the latest run with the same inputs, and saved by every run, failed ones
      # included, so a failing build still speeds up the next one.
      - id: gradle-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('yarn.lock', 'apps/mobile/app.config.ts') }}-${{ github.run_id }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ hashFiles('yarn.lock', 'apps/mobile/app.config.ts') }}-
            gradle-${{ runner.os }}-
      - run: nix develop --command yarn install --immutable
      # The emulator is x86_64: building one ABI instead of four keeps the job well under its limit.
      - run: nix develop --command yarn workspace @mes-courses/e2e-tests e2e:build:android
        env:
          ORG_GRADLE_PROJECT_reactNativeArchitectures: x86_64
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          avd-name: Pixel_API_35
          disable-animations: true
          script: nix develop --command yarn workspace @mes-courses/e2e-tests e2e:test:android
      - if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: detox-artifacts
          path: tests/e2e/artifacts/
          if-no-files-found: ignore
